 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منصة تحليل نتائج التوحيد</title>

<style>
body{font-family:Arial;background:#eef3ef;margin:0}
.header{background:#2f855a;color:#fff;padding:15px;text-align:center;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;padding:20px}
.card{
background:#fff;padding:20px;text-align:center;border-radius:12px;
box-shadow:0 2px 5px rgba(0,0,0,.1);cursor:pointer;
border-bottom:5px solid #ccc;font-size:16px
}
.section{display:none;padding:20px}
.active{display:block}
input,textarea,select{width:100%;padding:10px;margin-top:5px}
button{padding:10px;background:#2f855a;color:#fff;border:none;margin-top:5px}
.dark{background:#111;color:#fff}
.dark .card{background:#222;color:#fff}
.chart{margin-top:20px}
</style>
</head>

<body>

<div class="header">🎓 منصة تحليل نتائج مادة التوحيد</div>

<div id="home" class="section active">
<div class="grid">

<div class="card" onclick="show('classes')">🏫 إدارة الفصول</div>
<div class="card" onclick="show('students')">👩‍🎓 الطالبات</div>
<div class="card" onclick="show('grades')">✍️ إدخال الدرجات</div>
<div class="card" onclick="show('analysis')">📊 التحليل</div>
<div class="card" onclick="show('loss')">⚠️ الفاقد</div>
<div class="card" onclick="show('plans')">💊 الخطط</div>

</div>

<button onclick="toggleDark()">🌙 الوضع الليلي</button>
</div>

<!-- الفصول -->
<div id="classes" class="section">
<h3>الفصول</h3>
<input id="className" placeholder="اسم الفصل">
<button onclick="addClass()">إضافة</button>
<div id="classList"></div>
<button onclick="show('home')">رجوع</button>
</div>

<!-- الطالبات -->
<div id="students" class="section">
<h3>الطالبات</h3>

<select id="classSelect"></select>

<textarea id="studentsInput" placeholder="أدخل الأسماء كل اسم في سطر"></textarea>

<button onclick="addStudents()">حفظ</button>

<div id="studentsList"></div>

<button onclick="show('home')">رجوع</button>
</div>

<!-- الدرجات -->
<div id="grades" class="section">
<h3>الدرجات</h3>

<select id="studentSelect"></select>

<input id="g1" placeholder="الفترة الأولى">
<input id="g2" placeholder="الفترة الثانية">

<button onclick="saveGrades()">حفظ</button>

<button onclick="show('home')">رجوع</button>
</div>

<!-- التحليل -->
<div id="analysis" class="section">
<h3>التحليل</h3>

<div id="result"></div>

<canvas id="chart" width="300" height="300"></canvas>

<button onclick="show('home')">رجوع</button>
</div>

<!-- الفاقد -->
<div id="loss" class="section">
<h3>الفاقد التعليمي</h3>
<div id="lossList"></div>
<button onclick="show('home')">رجوع</button>
</div>

<!-- الخطط -->
<div id="plans" class="section">
<h3>الخطط</h3>
<div id="plansList"></div>
<button onclick="show('home')">رجوع</button>
</div>

<script>
function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'))
document.getElementById(id).classList.add('active')
if(id==="analysis") analyze()
if(id==="loss") renderLoss()
if(id==="plans") renderPlans()
}

let classes=JSON.parse(localStorage.getItem('classes')||'[]')
let students=JSON.parse(localStorage.getItem('students')||'[]')

function save(){
localStorage.setItem('classes',JSON.stringify(classes))
localStorage.setItem('students',JSON.stringify(students))
}

function addClass(){
let name=document.getElementById('className').value
if(!name)return
classes.push(name)
save()
render()
}

function addStudents(){
let text=document.getElementById('studentsInput').value
let c=document.getElementById('classSelect').value
if(!text||!c)return
text.split('\n').forEach(n=>{
students.push({name:n,class:c,g1:0,g2:0})
})
save()
render()
}

function saveGrades(){
let name=document.getElementById('studentSelect').value
let g1=+document.getElementById('g1').value
let g2=+document.getElementById('g2').value
let s=students.find(x=>x.name===name)
s.g1=g1
s.g2=g2
save()
}

function render(){
let cl=document.getElementById('classList')
cl.innerHTML=''
classes.forEach(c=>{
cl.innerHTML+=`<div>${c}</div>`
})

let cs=document.getElementById('classSelect')
cs.innerHTML=''
classes.forEach(c=>{
cs.innerHTML+=`<option>${c}</option>`
})

let sl=document.getElementById('studentsList')
sl.innerHTML=''
students.forEach(s=>{
sl.innerHTML+=`<div>${s.name} (${s.class})</div>`
})

let ss=document.getElementById('studentSelect')
ss.innerHTML=''
students.forEach(s=>{
ss.innerHTML+=`<option>${s.name}</option>`
})
}

function analyze(){
let high=0,mid=0,low=0
students.forEach(s=>{
let avg=(s.g1+s.g2)/2
if(avg>=90)high++
else if(avg>=70)mid++
else low++
})
document.getElementById('result').innerText=
`فوق المتوسط: ${high} | ضمن المتوسط: ${mid} | دون المتوسط: ${low}`

drawChart(high,mid,low)
}

function drawChart(a,b,c){
let ctx=document.getElementById('chart').getContext('2d')
ctx.clearRect(0,0,300,300)

let total=a+b+c
let start=0

function draw(val,color){
let angle=(val/total)*Math.PI*2
ctx.beginPath()
ctx.moveTo(150,150)
ctx.fillStyle=color
ctx.arc(150,150,100,start,start+angle)
ctx.fill()
start+=angle
}

draw(a,'green')
draw(b,'orange')
draw(c,'red')
}

function renderLoss(){
let div=document.getElementById('lossList')
div.innerHTML=''
students.forEach(s=>{
let avg=(s.g1+s.g2)/2
if(avg<70){
div.innerHTML+=`<div>${s.name} - فاقد</div>`
}
})
}

function renderPlans(){
let div=document.getElementById('plansList')
div.innerHTML=''
students.forEach(s=>{
let avg=(s.g1+s.g2)/2
if(avg<70) div.innerHTML+=`<div>${s.name} خطة علاجية</div>`
else if(avg<90) div.innerHTML+=`<div>${s.name} متابعة</div>`
else div.innerHTML+=`<div>${s.name} إثرائية</div>`
})
}

function toggleDark(){
document.body.classList.toggle('dark')
}

render()
</script>

</body>
</html>
