 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منصة التوحيد النهائية</title>

<style>
body{font-family:tahoma;background:#eef3ef;margin:0}
.header{background:#2f855a;color:#fff;padding:15px;text-align:center;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:20px}
.card{background:#fff;padding:15px;border-radius:12px;text-align:center;cursor:pointer}
.section{display:none;padding:20px}
.active{display:block}
input,textarea,select{width:100%;padding:8px;margin-top:5px}
button{padding:8px;background:#2f855a;color:#fff;border:none;margin-top:5px}
.dark{background:#111;color:#fff}
.dark .card{background:#222}
</style>
</head>

<body>

<div class="header">🎓 منصة التوحيد</div>

<div id="home" class="section active">
<div class="grid">
<div class="card" onclick="go('data')">⚙️ البيانات</div>
<div class="card" onclick="go('classes')">🏫 الفصول</div>
<div class="card" onclick="go('students')">👩‍🎓 الطالبات</div>
<div class="card" onclick="go('grades')">✍️ الدرجات</div>
<div class="card" onclick="go('analysis')">📊 التحليل</div>
<div class="card" onclick="go('loss')">⚠️ الفاقد</div>
<div class="card" onclick="go('plans')">💊 الخطط</div>
<div class="card" onclick="go('parents')">👨‍👩‍👧 أولياء الأمور</div>
<div class="card" onclick="go('sources')">🌐 المصادر</div>
<div class="card" onclick="go('games')">🎮 الألعاب</div>
<div class="card" onclick="go('awards')">🏆 التكريم</div>
<div class="card" onclick="go('archive')">📁 الأرشيف</div>
<div class="card" onclick="go('reports')">📋 التقارير</div>
</div>

<button onclick="toggleDark()">🌙 وضع ليلي</button>
</div>

<!-- البيانات -->
<div id="data" class="section">
<h3>البيانات الأساسية</h3>
<input id="school" placeholder="المدرسة">
<input id="teacher" placeholder="المعلمة">
<input id="year" placeholder="السنة">
<button onclick="saveData()">حفظ</button>
</div>

<!-- الفصول -->
<div id="classes" class="section">
<input id="className">
<button onclick="addClass()">إضافة فصل</button>
<div id="classList"></div>
</div>

<!-- الطالبات -->
<div id="students" class="section">
<select id="classSelect"></select>
<textarea id="names"></textarea>
<button onclick="addStudents()">حفظ</button>
<div id="studentsList"></div>
</div>

<!-- الدرجات -->
<div id="grades" class="section">
<select id="studentSelect"></select>
<input id="g1" placeholder="الفترة الأولى">
<input id="g2" placeholder="الفترة الثانية">
<button onclick="saveGrades()">حفظ</button>
</div>

<!-- التحليل -->
<div id="analysis" class="section">
<div id="analysisResult"></div>
</div>

<!-- الفاقد -->
<div id="loss" class="section">
<div id="lossList"></div>
</div>

<!-- الخطط -->
<div id="plans" class="section">
<div id="plansList"></div>
</div>

<!-- أولياء الأمور -->
<div id="parents" class="section">
<input id="pname">
<input id="pphone">
<button onclick="addParent()">حفظ</button>
<div id="parentsList"></div>
</div>

<!-- المصادر -->
<div id="sources" class="section">
<a href="https://ien.edu.sa" target="_blank">عين</a><br>
<a href="https://schools.madrasati.sa" target="_blank">مدرستي</a>
</div>

<!-- الألعاب -->
<div id="games" class="section">
<a href="https://kahoot.com" target="_blank">Kahoot</a><br>
<a href="https://quizizz.com" target="_blank">Quizizz</a><br>
<a href="https://wordwall.net" target="_blank">Wordwall</a><br>
<a href="https://blooket.com" target="_blank">Blooket</a>
</div>

<!-- التكريم -->
<div id="awards" class="section">
<div id="awardsList"></div>
</div>

<!-- الأرشيف -->
<div id="archive" class="section">
<button onclick="saveArchive()">حفظ نسخة</button>
<div id="archiveList"></div>
</div>

<!-- التقارير -->
<div id="reports" class="section">
<button onclick="window.print()">طباعة</button>
</div>

<script>
let classes=JSON.parse(localStorage.getItem('c')||'[]')
let students=JSON.parse(localStorage.getItem('s')||'[]')
let parents=JSON.parse(localStorage.getItem('p')||'[]')
let archive=JSON.parse(localStorage.getItem('a')||'[]')

function saveAll(){
localStorage.setItem('c',JSON.stringify(classes))
localStorage.setItem('s',JSON.stringify(students))
localStorage.setItem('p',JSON.stringify(parents))
localStorage.setItem('a',JSON.stringify(archive))
}

function go(x){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'))
document.getElementById(x).classList.add('active')
if(x=="analysis") analyze()
if(x=="loss") showLoss()
if(x=="plans") showPlans()
render()
}

function addClass(){classes.push(className.value);saveAll();render()}
function addStudents(){
names.value.split('\n').forEach(n=>students.push({name:n,class:classSelect.value,g1:0,g2:0}))
saveAll();render()
}

function saveGrades(){
let s=students.find(x=>x.name==studentSelect.value)
s.g1=+g1.value
s.g2=+g2.value
saveAll()
}

function analyze(){
let h=0,m=0,l=0
students.forEach(s=>{
let a=(s.g1+s.g2)/2
if(a>=90)h++;else if(a>=70)m++;else l++
})
analysisResult.innerText=`فوق: ${h} | ضمن: ${m} | دون: ${l}`
}

function showLoss(){
lossList.innerHTML=students.filter(s=>(s.g1+s.g2)/2<70).map(s=>s.name).join("<br>")
}

function showPlans(){
plansList.innerHTML=students.map(s=>{
let a=(s.g1+s.g2)/2
if(a<70)return s.name+" علاجية"
if(a<90)return s.name+" متابعة"
return s.name+" إثرائية"
}).join("<br>")
}

function addParent(){
parents.push(pname.value+"-"+pphone.value)
saveAll()
render()
}

function saveArchive(){
archive.push(JSON.stringify(students))
saveAll()
render()
}

function render(){
classSelect.innerHTML=classes.map(c=>`<option>${c}</option>`).join("")
studentSelect.innerHTML=students.map(s=>`<option>${s.name}</option>`).join("")
studentsList.innerHTML=students.map(s=>s.name+"("+s.class+")").join("<br>")
classList.innerHTML=classes.join("<br>")
parentsList.innerHTML=parents.join("<br>")
archiveList.innerHTML=archive.length+" نسخة محفوظة"
awardsList.innerHTML=students.filter(s=>(s.g1+s.g2)/2>=90).map(s=>s.name).join("<br>")
}

function saveData(){
localStorage.setItem('school',school.value)
localStorage.setItem('teacher',teacher.value)
localStorage.setItem('year',year.value)
}

function toggleDark(){document.body.classList.toggle('dark')}

render()
</script>

</body>
</html>
