 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة الإتقان الذكي</title>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
body {
    font-family: Tahoma;
    background: #f0f2f5;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
}

.header {
    background: #2d6a4f;
    color: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

.btn {
    padding: 10px;
    border-radius: 10px;
    border: none;
    margin: 5px;
    cursor: pointer;
}

.card {
    background: #f8f9fa;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

.upload-section {
    background: #e9f5ee;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
}

input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100%;
}

#skillsList {
    margin-top: 15px;
    background: white;
    padding: 10px;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>منصة الإتقان الذكي</h1>
</div>

<!-- البيانات -->
<div class="upload-section">

<h3>البيانات الأساسية</h3>

<input type="text" id="subjectName" placeholder="اسم المادة"><br><br>
<input type="text" id="teacherName" placeholder="اسم المعلمة"><br><br>

<label style="background:#2d6a4f;color:white;padding:10px;border-radius:10px;cursor:pointer;display:block;text-align:center;">
رفع المنهج PDF
<input type="file" id="file-upload" accept="application/pdf" onchange="processPDF(this)" hidden>
</label>

<div id="skillsList">
المهارات تظهر هنا
</div>

</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';


// حفظ تلقائي
["subjectName","teacherName"].forEach(id=>{
let el=document.getElementById(id);

if(localStorage.getItem(id)){
el.value=localStorage.getItem(id);
}

el.addEventListener("input",()=>{
localStorage.setItem(id,el.value);
});
});


// قراءة PDF
async function processPDF(input){

let file=input.files[0];
if(!file)return;

let reader=new FileReader();

reader.onload=async function(){

let pdf=await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;

let skills=[];

for(let i=1;i<=pdf.numPages;i++){

let page=await pdf.getPage(i);
let txt=await page.getTextContent();

let text=txt.items.map(s=>s.str).join(" ");

let match=text.match(/(أن\s\w+[^.]{10,50}|يميز\s[^.]{10,50}|يعدد\s[^.]{10,50})/g);

if(match)skills.push(...match);
}

showSkills(skills);

};

reader.readAsArrayBuffer(file);
}


// عرض المهارات
function showSkills(skills){

let box=document.getElementById("skillsList");

if(!skills.length){
box.innerHTML="لم يتم العثور على مهارات";
return;
}

skills=[...new Set(skills)];

box.innerHTML="<ul>"+skills.map(s=>"<li>"+s+"</li>").join("")+"</ul>";

localStorage.setItem("skills",JSON.stringify(skills));
}


// استرجاع
window.onload=()=>{
let saved=JSON.parse(localStorage.getItem("skills"));
if(saved)showSkills(saved);
};

</script>

</body>
</html>
