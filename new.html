 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منصة الإتقان الذكي</title>

<style>
body{font-family:tahoma;background:#eef3ef;margin:0}
header{background:#2e7d32;color:#fff;padding:15px;text-align:center}
.container{padding:15px}
.card{background:#fff;border-radius:12px;padding:15px;margin:10px 0}
button{background:#2e7d32;color:#fff;padding:8px;border:none;border-radius:8px}
input,textarea,select{width:100%;padding:8px;margin:5px 0}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
</style>
</head>

<body>

<header>📊 منصة الإتقان الذكي</header>

<div class="container">

<div class="nav">
<button onclick="show('data')">البيانات</button>
<button onclick="show('students')">الطالبات</button>
<button onclick="show('skills')">المهارات</button>
<button onclick="show('grades')">الدرجات</button>
<button onclick="show('analysis')">التحليل</button>
<button onclick="show('loss')">الفاقد</button>
<button onclick="show('parents')">أولياء الأمور</button>
<button onclick="show('awards')">التكريم</button>
<button onclick="show('games')">الألعاب</button>
<button onclick="show('archive')">الأرشيف</button>
</div>

<!-- البيانات -->
<div id="data" class="card section">
<h3>⚙️ البيانات</h3>
<input id="school" placeholder="المدرسة">
<input id="teacher" placeholder="المعلمة">
<input id="manager" placeholder="المديرة">
<input id="subject" placeholder="المادة">
<input id="year" placeholder="العام">
</div>

<!-- الطالبات -->
<div id="students" class="card section" style="display:none">
<h3>👩‍🎓 الطالبات</h3>
<textarea id="names"></textarea>
<button onclick="saveStudents()">حفظ</button>
<div id="studentsList"></div>
</div>

<!-- المهارات -->
<div id="skills" class="card section" style="display:none">
<h3>🧠 المهارات</h3>
<input id="skillInput">
<button onclick="addSkill()">إضافة</button>
<button onclick="autoSkills()">توليد</button>
<div id="skillsList"></div>
</div>

<!-- الدرجات -->
<div id="grades" class="card section" style="display:none">
<h3>✏️ الدرجات (فترتين)</h3>
<select id="term">
<option value="1">الفترة الأولى</option>
<option value="2">الفترة الثانية</option>
</select>
<div id="gradesList"></div>
</div>

<!-- التحليل -->
<div id="analysis" class="card section" style="display:none">
<h3>📊 التحليل</h3>
<div id="analysisList"></div>
</div>

<!-- الفاقد -->
<div id="loss" class="card section" style="display:none">
<h3>⚠️ الفاقد</h3>
<div id="lossList"></div>
</div>

<!-- أولياء الأمور -->
<div id="parents" class="card section" style="display:none">
<h3>👨‍👩‍👧 أولياء الأمور</h3>
<input id="pname">
<input id="pphone">
<button onclick="addParent()">حفظ</button>
<div id="parentsList"></div>
</div>

<!-- التكريم -->
<div id="awards" class="card section" style="display:none">
<h3>🏆 التكريم</h3>
<div id="awardsList"></div>
</div>

<!-- الألعاب -->
<div id="games" class="card section" style="display:none">
<h3>🎮 الألعاب</h3>
<a href="https://kahoot.com" target="_blank">Kahoot</a><br>
<a href="https://quizizz.com" target="_blank">Quizizz</a>
</div>

<!-- الأرشيف -->
<div id="archive" class="card section" style="display:none">
<h3>📂 الأرشيف</h3>
<input id="archiveTitle">
<textarea id="archiveContent"></textarea>
<button onclick="saveArchive()">حفظ</button>
<div id="archiveList"></div>
</div>

</div>

<script>

function show(id){
document.querySelectorAll('.section').forEach(s=>s.style.display='none');
document.getElementById(id).style.display='block';
}

function saveStudents(){
let data=document.getElementById("names").value.split("\n");
localStorage.setItem("students",JSON.stringify(data));
renderStudents();
}

function renderStudents(){
let data=JSON.parse(localStorage.getItem("students")||"[]");
let html="";
data.forEach(s=>html+=`<div>${s}</div>`);
document.getElementById("studentsList").innerHTML=html;
renderGrades();
}

function addSkill(){
let s=document.getElementById("skillInput").value;
let skills=JSON.parse(localStorage.getItem("skills")||"[]");
skills.push(s);
localStorage.setItem("skills",JSON.stringify(skills));
renderSkills();
}

function autoSkills(){
let list=["تمييز التوحيد","الشرك","العبادة"];
localStorage.setItem("skills",JSON.stringify(list));
renderSkills();
}

function renderSkills(){
let data=JSON.parse(localStorage.getItem("skills")||"[]");
let html="";
data.forEach(s=>html+=`<div>${s}</div>`);
document.getElementById("skillsList").innerHTML=html;
}

function renderGrades(){
let students=JSON.parse(localStorage.getItem("students")||"[]");
let html="";
students.forEach((s,i)=>{
html+=`${s} <input type="number" onchange="saveGrade(${i},this.value)"><br>`;
});
document.getElementById("gradesList").innerHTML=html;
}

function saveGrade(i,v){
let term=document.getElementById("term").value;
let grades=JSON.parse(localStorage.getItem("grades")||"{}");
if(!grades[term]) grades[term]=[];
grades[term][i]=v;
localStorage.setItem("grades",JSON.stringify(grades));
analyze();
}

function analyze(){
let students=JSON.parse(localStorage.getItem("students")||"[]");
let grades=JSON.parse(localStorage.getItem("grades")||"{}");
let term=document.getElementById("term").value;
let g=grades[term]||[];

let html="",loss="",awards="";
students.forEach((s,i)=>{
let x=g[i]||0;
html+=`${s} - ${x}<br>`;
if(x<60) loss+=`<div>${s}</div>`;
if(x>90) awards+=`<div>${s}</div>`;
});

document.getElementById("analysisList").innerHTML=html;
document.getElementById("lossList").innerHTML=loss;
document.getElementById("awardsList").innerHTML=awards;
}

function addParent(){
let n=document.getElementById("pname").value;
let p=document.getElementById("pphone").value;
let data=JSON.parse(localStorage.getItem("parents")||"[]");
data.push({n,p});
localStorage.setItem("parents",JSON.stringify(data));
renderParents();
}

function renderParents(){
let data=JSON.parse(localStorage.getItem("parents")||"[]");
let html="";
data.forEach(d=>html+=`<div>${d.n}-${d.p}</div>`);
document.getElementById("parentsList").innerHTML=html;
}

function saveArchive(){
let t=document.getElementById("archiveTitle").value;
let c=document.getElementById("archiveContent").value;
let data=JSON.parse(localStorage.getItem("archive")||"[]");
data.push({t,c});
localStorage.setItem("archive",JSON.stringify(data));
renderArchive();
}

function renderArchive(){
let data=JSON.parse(localStorage.getItem("archive")||"[]");
let html="";
data.forEach(d=>html+=`<div>${d.t}</div>`);
document.getElementById("archiveList").innerHTML=html;
}

renderStudents();
renderSkills();
renderParents();
renderArchive();

</script>

</body>
</html>
